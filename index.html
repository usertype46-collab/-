<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百富粉體塗裝自動槍參數系統</title>
    <style>
        :root {
            --primary: #4F46E5;
            --background: #F3F4F6;
            --surface: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1, h2 { color: #111827; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }
        .preview-box {
            margin-top: 20px;
            text-align: center;
            border: 2px dashed #D1D5DB;
            padding: 20px;
            border-radius: 8px;
        }
        /* 關鍵設定：確保圖片正常顯示 */
        img#imagePreview {
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #EEF2FF;
            border-left: 4px solid var(--primary);
            border-radius: 4px;
            display: none;
        }
        .loader {
            display: none;
            font-size: 14px;
            color: var(--primary);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>百富粉體塗裝自動槍參數系統</h1>
    <p>完全無伺服器 (Serverless) GitHub Pages 版本</p>

    <!-- 系統設定區 -->
    <div style="background: #F9FAFB; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
        <h2>⚙️ 系統設定</h2>
        <div class="form-group">
            <label>Google Apps Script URL (GAS):</label>
            <input type="text" id="gasUrl" placeholder="請輸入 Google Script Web App 網址">
        </div>
        <div class="form-group">
            <label>NVIDIA API Key:</label>
            <input type="password" id="nvApiKey" placeholder="nvapi-...">
        </div>
        <button onclick="saveSettings()">儲存設定</button>
    </div>

    <!-- 上傳與操作區 -->
    <h2>📤 圖片分析與上傳</h2>
    <div class="form-group">
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="btnUpload" onclick="processAndUpload()">上傳至 Google Drive</button>
        <button id="btnAnalyze" onclick="analyzeImage()">AI 構件分析</button>
        <button id="btnParse" onclick="parseItemName()">AI 解析料號/品名</button>
    </div>

    <div class="loader" id="loadingIndicator">處理中，請稍候...</div>

    <!-- 結果與預覽區 -->
    <div class="result-box" id="resultBox"></div>
    
    <div class="preview-box">
        <p id="previewText">圖片預覽將顯示於此</p>
        <!-- 關鍵：使用 referrerpolicy="no-referrer" 確保 Google Drive 直連圖片不被阻擋 -->
        <img id="imagePreview" referrerpolicy="no-referrer" alt="預覽圖片">
    </div>
</div>

<script>
    // 預設模型設定
    const MODEL_NAME = "nvidia/nemotron-3-ultra-550b-a55b";
    let currentBase64 = null;
    let driveDirectUrl = null;

    // 頁面載入時讀取 LocalStorage 的設定
    window.onload = () => {
        const savedGas = localStorage.getItem('gasUrl');
        const savedKey = localStorage.getItem('nvApiKey');
        if (savedGas) document.getElementById('gasUrl').value = savedGas;
        if (savedKey) document.getElementById('nvApiKey').value = savedKey;
        
        // 監聽圖片選擇事件，生成預覽
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                currentBase64 = event.target.result;
                const imgEl = document.getElementById('imagePreview');
                imgEl.src = currentBase64;
                imgEl.style.display = 'block';
                document.getElementById('previewText').style.display = 'none';
            };
            reader.readAsDataURL(file);
        });
    };

    function saveSettings() {
        localStorage.setItem('gasUrl', document.getElementById('gasUrl').value);
        localStorage.setItem('nvApiKey', document.getElementById('nvApiKey').value);
        alert('設定已儲存在瀏覽器中！');
    }

    function showLoading(show) {
        document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        document.querySelectorAll('button').forEach(btn => btn.disabled = show);
    }

    function showResult(text) {
        const box = document.getElementById('resultBox');
        box.style.display = 'block';
        box.innerHTML = `<strong>執行結果：</strong><br>${text}`;
    }

    // 將 Google Drive 網址轉換為直連網址
    function convertGoogleDriveUrl(url) {
        if (!url) return url;
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
            return `https://lh3.googleusercontent.com/d/${match[1]}`;
        }
        return url;
    }

    // HTML5 Canvas 圖片壓縮 (取代原有的 Python Pillow / Node.js sharp)
    function compressImage(base64Str, quality = 0.8) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = base64Str;
        });
    }

    // 1. 上傳至 Google Drive
    async function processAndUpload() {
        const gasUrl = document.getElementById('gasUrl').value;
        if (!gasUrl) return alert('請先設定 GAS URL');
        if (!currentBase64) return alert('請先選擇圖片');

        showLoading(true);
        try {
            // 進行壓縮
            const compressedDataUrl = await compressImage(currentBase64, 0.8);
            // 移除 Base64 標頭以符合原本的 GAS 邏輯
            const base64Data = compressedDataUrl.replace(/^data:image\/\w+;base64,/, "");
            const filename = `baifu_${Date.now()}.jpg`;

            // 使用 text/plain 避免觸發複雜的 CORS Preflight
            const response = await fetch(gasUrl, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    fileName: filename,
                    mimeType: 'image/jpeg',
                    base64: base64Data
                })
            });

            const result = JSON.parse(await response.text());
            
            if (result.success) {
                driveDirectUrl = convertGoogleDriveUrl(result.url);
                // 直接將直連網址交給 img，加上 referrerpolicy 即可完美顯示
                document.getElementById('imagePreview').src = driveDirectUrl;
                showResult(`✅ 上傳成功！<br>直連網址：<a href="${driveDirectUrl}" target="_blank">點擊查看</a>`);
            } else {
                throw new Error(result.error || "未知錯誤");
            }
        } catch (error) {
            alert(`上傳失敗：${error.message}`);
        } finally {
            showLoading(false);
        }
    }

    // 2. AI 構件分析 (呼叫 NVIDIA API)
    async function analyzeImage() {
        const apiKey = document.getElementById('nvApiKey').value;
        if (!apiKey) return alert('請先設定 NVIDIA API Key');
        if (!currentBase64) return alert('請先選擇圖片');

        showLoading(true);
        try {
            // 壓縮以減少 API 傳輸量
            const compressedDataUrl = await compressImage(currentBase64, 0.8);
            // 模擬原有的 Items 資料庫
            const mockItems = [{ id: "A01", name: "轉軸同心固定座" }, { id: "B02", name: "面板支架" }]; 

            const response = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        {
                            role: "user",
                            content: [
                                { 
                                    type: "text", 
                                    text: `你是一個專業的粉體塗裝自動槍參數辨識與分析助手。現有資料庫構件清單如下：${JSON.stringify(mockItems)}。請辨識圖片中最符合哪一個構件，並【僅回傳該構件的 id字串】，不要包含任何其他文字或說明。` 
                                },
                                { 
                                    type: "image_url", 
                                    image_url: { url: compressedDataUrl } 
                                }
                            ]
                        }
                    ],
                    temperature: 0.1,
                    max_tokens: 50
                })
            });

            const data = await response.json();
            if (data.choices && data.choices.length > 0) {
                showResult(`🔍 構件 ID：<strong>${data.choices[0].message.content.trim()}</strong>`);
            } else {
                throw new Error(data.error?.message || "無法獲取 API 回應");
            }
        } catch (error) {
            alert(`分析失敗：${error.message}`);
        } finally {
            showLoading(false);
        }
    }

    // 3. AI 解析料號/品名 (呼叫 NVIDIA API)
    async function parseItemName() {
        const apiKey = document.getElementById('nvApiKey').value;
        if (!apiKey) return alert('請先設定 NVIDIA API Key');
        if (!currentBase64) return alert('請先選擇圖片');

        showLoading(true);
        try {
            const compressedDataUrl = await compressImage(currentBase64, 0.8);

            const response = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        {
                            role: "user",
                            content: [
                                { 
                                    type: "text", 
                                    text: "你是一個專業的圖面與工單標籤文字辨識助手。請仔細辨識圖片中的「料號」與「品名」。\n請將辨識結果格式化為「料號/品名」（例如：UC-280B1-C003-WE/轉軸同心固定座.白）。\n【注意事項】：\n1. 料號與品名之間使用單一斜線「/」分隔，左右不要多餘空格。\n2. 請【僅回傳格式化的 料號/品名 字串】，絕對不要包含任何額外說明、Markdown引號或標點符號。"
                                },
                                { 
                                    type: "image_url", 
                                    image_url: { url: compressedDataUrl } 
                                }
                            ]
                        }
                    ],
                    temperature: 0.1,
                    max_tokens: 100
                })
            });

            const data = await response.json();
            if (data.choices && data.choices.length > 0) {
                let resultText = data.choices[0].message.content.trim();
                resultText = resultText.replace(/^[`'"]+|[`'"]+$/g, '');
                showResult(`🏷️ 解析結果：<strong>${resultText}</strong>`);
            } else {
                throw new Error(data.error?.message || "無法獲取 API 回應");
            }
        } catch (error) {
            alert(`解析失敗：${error.message}`);
        } finally {
            showLoading(false);
        }
    }
</script>
</body>
</html>
